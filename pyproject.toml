[project]
name = "eth-median-apr-compute"
version = "0.1.0"
description = "Compute the median ETH validator APR from the Xatu public dataset"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.0",
  "numpy>=1.26",
  "pandas>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
